name: Check

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: pytest & ruff
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install ruff

      - name: Run ruff check
        run: ruff check .

      - name: Run pytest
        run: pytest
